name: Kinetra
options:
  bundleIdPrefix: org.kinetra
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Kinetra:
    type: application
    platform: iOS
    sources:
      - Kinetra
      - Shared
    dependencies:
      - target: KinetraWatch
    entitlements:
      path: Kinetra/Kinetra.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: Kinetra/Info.plist
      properties:
        CFBundleDisplayName: Kinetra
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: Kinetra reads heart rate from the Apple Watch workout so the technician can see how hard you are working.
        NSHealthUpdateUsageDescription: Kinetra starts a workout on your Apple Watch so heart rate can be measured during exercise.
        NSLocalNetworkUsageDescription: Kinetra connects to the exercise hub on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.kinetra.app
        TARGETED_DEVICE_FAMILY: "1"
  KinetraWatch:
    type: application
    platform: watchOS
    sources:
      - KinetraWatch
      - Shared
    entitlements:
      path: KinetraWatch/KinetraWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: KinetraWatch/Info.plist
      properties:
        CFBundleDisplayName: Kinetra
        WKApplication: true
        WKCompanionAppBundleIdentifier: org.kinetra.app
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: Kinetra reads your heart rate during the workout and sends it to the exercise hub.
        NSHealthUpdateUsageDescription: Kinetra records a workout session so heart rate is measured continuously.
        NSLocalNetworkUsageDescription: Kinetra connects to the exercise hub on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.kinetra.app.watchkitapp
  KinetraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - KinetraTests
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.kinetra.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Kinetra:
    build:
      targets:
        Kinetra: all
        KinetraWatch: all
    test:
      targets:
        - KinetraTests
  KinetraWatch:
    build:
      targets:
        KinetraWatch: all
