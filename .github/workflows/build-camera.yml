name: build camera app

# Runs by hand, or when a version tag such as v1.2 is pushed
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# The release job needs permission to create releases and tags
permissions:
  contents: write

# One build per operating system, because PyInstaller cannot build for another platform
jobs:
  build:
    strategy:
      # A failure on one platform does not cancel the others
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: ubuntu-22.04, name: linux-x64 }
          - { os: ubuntu-22.04-arm, name: linux-arm64 }  # Jetson and Raspberry Pi class devices
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # OpenCV needs these libraries on Linux
      - name: system libraries (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 libgles2 libegl1

      - name: install
        working-directory: vision
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # The tests run before the build so a broken build is not packaged
      - name: test
        working-directory: vision
        run: python -m pytest tests -q

      - name: build
        working-directory: vision
        run: pyinstaller --noconfirm packaging/kinetra-camera.spec

      # Starts the built program once to prove that the bundled files are all there
      - name: smoke test the built app
        working-directory: vision
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then dist/kinetra-camera/kinetra-camera.exe --selftest
          else dist/kinetra-camera/kinetra-camera --selftest; fi

      # Windows gets a zip and the Linux builds get a tar file
      - name: package
        working-directory: vision/dist
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a ../../kinetra-camera-${{ matrix.name }}.zip kinetra-camera
          else tar czf ../../kinetra-camera-${{ matrix.name }}.tar.gz kinetra-camera; fi

      - uses: actions/upload-artifact@v4
        with:
          name: kinetra-camera-${{ matrix.name }}
          path: kinetra-camera-${{ matrix.name }}.*
          # Fail here instead of silently uploading nothing
          if-no-files-found: error

  # Runs once after every build has finished and publishes all the files together
  release:
    needs: build
    # Still publishes the builds that worked if one platform failed
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kinetra-camera-*
          path: release-files
          merge-multiple: true

      - name: list files
        run: ls -lh release-files

      # A pushed tag such as v1.2 keeps its own name. A manual run gets build-<run number>.
      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build {0}', github.run_number) }}
          generate_release_notes: true
          files: release-files/*
